name: Instagram → LP 自動同期

# 原則1日1回。変化があった時だけ commit → push（= Cloudflare Pagesが再デプロイ）。
on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = JST 06:00
  workflow_dispatch:        # 手動実行も可

permissions:
  contents: write           # 生成物を自身のリポジトリへコミットするため

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 取得・生成（変化時のみ public/ を更新）
        id: sync
        env:
          # Secretsに登録された値だけを渡す。未登録ならモックで動く。
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/sync.mjs

      - name: 変化があればコミット＆プッシュ
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "shapeup-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/ data/instagram.json
          if git diff --cached --quiet; then
            echo "差分なし（スキップ）"
          else
            git commit -m "chore: Instagram最新投稿をLPへ反映 [skip ci]"
            git push
          fi
